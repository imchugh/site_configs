# L2 QC config for CumberlandPlain -- deltas from configs/qc/_range_defaults.yml only.
# Source: L2_autogen_CumberlandPlain.txt (PyFluxPro control file), converted by script.
# NOT PORTED: ['Fco2_EP', 'Fco2_EP_QC', 'Fe_EP', 'Fe_EP_QC', 'Fh_EP', 'Fh_EP_QC', 'Fm_EP', 'Fm_EP_QC'] -- see _range_defaults.yml's Diag note.
# RENAMED: CO2_IRGA_Av->CO2c_IRGA_Av

# Logger flux QC flags -- SmartFlux 0/1/2 flag scheme: reject 2

site: CumberlandPlain
variables:
  Fco2:
    flag_check: {source: [Fco2_QC], reject: [2]}
  Fe:
    flag_check: {source: [Fe_QC], reject: [2]}
  Fh:
    flag_check: {source: [Fh_QC], reject: [2]}
  Fm:
    comment: >-
      Momentum flux from EddyPro's Tau. The network reports Fm as a magnitude
      (rho * u*^2, as CumberlandPlain did until 2023-04-12).
    absolute:
      - start: 2023-04-12 16:30
        comment: >-
          EddyPro reports Tau signed from here (negative = downward): the
          16:00 record is missing (a SmartFlux restart) and Tau is never
          negative before it. |Tau| = air_density * u*^2 exactly in every
          quarter 2021-2026, so only the sign changed. About 12% of values
          after the change are positive: small night-time upward fluxes at
          low u*.
    flag_check: {source: [Fm_QC], reject: [2]}
