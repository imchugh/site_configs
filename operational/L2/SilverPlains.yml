# L2 QC config for SilverPlains -- deltas from configs/qc/_range_defaults.yml only.
# Source: L2_autogen_SilverPlains.txt (PyFluxPro control file), converted by script.
# NOT PORTED: ['AH_Ct', 'CO2_Ct', 'Diag_IRGA', 'Diag_SONIC', 'Fco2_EF', 'Fco2_EF_Ct', 'Fco2_EF_QC', 'Fe_EF', 'Fe_EF_Ct', 'Fe_EF_QC', 'Fh_EF', 'Fh_EF_Ct', 'Fh_EF_QC', 'Fm_EF', 'Fm_EF_QC'] -- see _range_defaults.yml's Diag note.
# RENAMED: CO2_IRGA_Av->CO2c_IRGA_Av, CO2_IRGA_Sd->CO2c_IRGA_Sd

site: SilverPlains
variables:
  Fg_0.08mc:  # default (-100, 150)
    range_check: {lower: -200, upper: 200}
    # First fleet use of mad_filter -- catches the 2026-05-28 transient spike
    # (381, 1064 W/m^2) that a fixed range can't bound without also clipping
    # genuine summer swings. Watch this site before considering it a Fg default.
    mad_filter:
      reference_var: Fsd
  # Logger flux QC flags -- EasyFlux 1-9 flag scheme: reject 8 and 9
  Fco2:
    flag_check: {source: [Fco2_QC], reject: [8, 9]}
  Fe:
    flag_check: {source: [Fe_QC], reject: [8, 9]}
  Fh:
    flag_check: {source: [Fh_QC], reject: [8, 9]}
  Fm:
    exclude_dates:
      - start: 2025-10-08 12:30
        end: 2025-12-16 09:30
        comment: >-
          IRGA down (Diag_IRGA 36000 every half-hour; ps, Ta, AH and CO2
          missing; Fh, Fe, Fco2 missing), so EasyFlux's TAU had no valid air
          density: about -0.003*u*^2 instead of about 1.1*u*^2, nearly always
          negative. Everything recovers at 2025-12-16 10:00.
    flag_check: {source: [Fm_QC], reject: [8, 9]}
