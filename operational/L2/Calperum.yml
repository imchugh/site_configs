# L2 QC config for Calperum -- deltas from configs/qc/_range_defaults.yml only.
#
# Currently no deltas: every range in PyFluxPro's control file for this site
# (templates/L2_autogen.txt, all plain RangeChecks) either matches the shared
# defaults or was promoted into them, so all range checks use the defaults.
# A variable with no entry here is still range-checked from _range_defaults.yml.
#
# Ported with these translations (PyFluxPro's daily/near-real-time names vs
# this pipeline's canonical names):
#   - Fco2_DL -> Fco2, Fe_DL -> Fe, Fh_DL -> Fh
#   - CO2_IRGA_Av/Sd -> CO2c_IRGA_Av/Sd: PyFluxPro's "CO2_IRGA_Av" is actually
#     CO2 mass concentration (mg/m^3, values ~700-920), not mole fraction
#     (confirmed against real PyFluxPro output, 2026-09)
# Not ported: Diag_IRGA / Diag_SONIC -- PyFluxPro's bounds are for averaged
# diagnostic codes, this pipeline's are raw invalid-sample counts (see
# _range_defaults.yml's Diag note).
