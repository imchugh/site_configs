# L2 QC config for Fletcherview -- deltas from configs/qc/_range_defaults.yml only.
# Source: L2_autogen_Fletcherview.txt (PyFluxPro control file), converted by script.
# NOT PORTED: ['Diag_IRGA', 'Diag_SONIC'] -- see _range_defaults.yml's Diag note.
# RENAMED: CO2_IRGA_Av->CO2c_IRGA_Av, CO2_IRGA_Sd->CO2c_IRGA_Sd, Fco2_DL->Fco2, Fe_DL->Fe, Fh_DL->Fh, RH->RH_25m

# Sparse open-savanna canopy -- persistent, timing-correlated Fg swings exceed
# the default (-100, 150), same regime as Boolcoomatta/Dookie (2026-09-29 audit).

site: Fletcherview
variables:
  Fg_0.08ma:  # default (-100, 150)
    range_check: {lower: -200, upper: 200}
  Fg_0.08md:  # default (-100, 150)
    range_check: {lower: -200, upper: 200}
  Tbody_RAD:
    exclude_dates:
      - start: 2022-03-08 11:30
        end: 2022-11-08 14:30
        comment: &fle_cnr4_2022 >-
          CNR4 body temperature wrong from the first record to a site visit:
          531-535 K (about 260 degC), unrelated to air temperature (r -0.31;
          r 0.975 and median Tb - Ta -0.1 K afterwards). The logger corrects
          longwave with it (Fld = Fld_raw + sigma*Tb^4), so Fld/Flu are ~4500
          W/m^2; from 2022-08-24 the raw longwave thermopile signal is bad too
          (thousands of W/m^2). Normal from 2022-11-08 15:00 (Tb) and
          2022-11-09 09:30 (raw longwave). Fn follows via its dependency.
  Fld:
    exclude_dates:
      - {start: 2022-03-08 11:30, end: 2022-11-08 14:30, comment: *fle_cnr4_2022}
  Flu:
    exclude_dates:
      - {start: 2022-03-08 11:30, end: 2022-11-08 14:30, comment: *fle_cnr4_2022}
