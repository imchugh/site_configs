# L2 QC config for HowardSprings: corrections and exclusions for the stitched
# L1 (old CR3000 logger to 2025-09-08 17:30, TERNflux CR1000XE from
# 2025-10-13 14:00), over fluxcore's _range_defaults.yml and
# _dependency_defaults.yml. Draft built in drafts/HowardSprings/.
# Earlier history (PyFluxPro port): no range deltas; Diag_IRGA/Diag_SONIC and
# Fg_0.08mc/md not ported; CO2_IRGA_Av/Sd -> CO2c_IRGA_Av/Sd, Fco2_DL -> Fco2,
# Fe_DL -> Fe, Fh_DL -> Fh.

site: HowardSprings
variables:
  Tbody_RAD:
    exclude_dates:
      - start: 2025-02-06 03:00
        end: 2025-09-08 17:30
        comment: >-
          Old CNR4 body PT100 failed from 2025-02-06 03:00: its resistance
          reads about -205 ohm (Lbody_Rs_PT100_Avg), Tb about -150 degC, for
          88% of records to the end of the old logger. The old program
          corrects Fld/Flu with Tb (Fld = raw + sigma*Tb^4, checked), so they
          are wrong too.
