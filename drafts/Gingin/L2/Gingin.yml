# DRAFT L2 QC config for Gingin's stitched L1 (drafts/Gingin/Gingin.yml).
# Otherwise as operational/L2/Gingin.yml: no deltas, runs on fluxcore's
# _range_defaults.yml and _dependency_defaults.yml.

site: Gingin
variables:
  # L1 WTD is the CS451's raw level (metres of water above the probe, rising
  # as the water table rises) in every era. Converted here to CF
  # water_table_depth (metres below ground, positive down):
  #   WTD = probe depth - level = 13.173 - level
  # Probe depth 13.173 = 9.81 m dip to water + 3.363 m above the probe at
  # install (the logger program's constants). The probe was never moved, so
  # one undated correction covers the whole record. PROVISIONAL: the first
  # logged reading (2022-08-05) is 3.507, not 3.363, which would make the
  # probe depth 13.317 -- confirm with the site operators.
  WTD:
    linear:
      - slope: -1.0
        offset: 13.173
  Ws_7m:
    exclude_dates:
      - start: 2023-01-25 19:00
        end: 2023-09-21 00:30
        comment: >-
          WS4 Windsonic died after 2023-01-25 18:30 (last real reading): no
          records to 2023-02-03, then exactly 0 every half-hour until the
          column ends (removed from the program, Oct 2023).
  Wd_7m:
    exclude_dates:
      - start: 2023-01-25 19:00
        end: 2023-09-21 00:30
        comment: >-
          WS4 Windsonic died after 2023-01-25 18:30 (last real reading): no
          records to 2023-02-03, then exactly 0 every half-hour until the
          column ends (removed from the program, Oct 2023).
  Ws_10m:
    exclude_dates:
      - start: 2023-01-25 19:00
        end: 2023-09-21 00:30
        comment: >-
          WS4 Windsonic died after 2023-01-25 18:30 (last real reading): no
          records to 2023-02-03, then exactly 0 every half-hour until the
          column ends (removed from the program, Oct 2023).
  Wd_10m:
    exclude_dates:
      - start: 2023-01-25 19:00
        end: 2023-09-21 00:30
        comment: >-
          WS4 Windsonic died after 2023-01-25 18:30 (last real reading): no
          records to 2023-02-03, then exactly 0 every half-hour until the
          column ends (removed from the program, Oct 2023).
  Tbody_RAD:
    exclude_dates:
      - start: 2026-10-20 12:00
        end: 2026-11-10 12:30
        comment: >-
          New CNR4's body thermistor miswired from the changeover until a site
          visit: Tb about -8000 to -12000 degC to 2026-11-10 09:30, no records
          10:00-12:30, valid from 13:00. Fld/Flu are corrected with Tb (median
          1e9 W/m^2 meanwhile), so all three are unsalvageable (user,
          2026-11-16).
  Fld:
    exclude_dates:
      - start: 2026-10-20 12:00
        end: 2026-11-10 12:30
        comment: >-
          New CNR4's body thermistor miswired from the changeover until a site
          visit: Tb about -8000 to -12000 degC to 2026-11-10 09:30, no records
          10:00-12:30, valid from 13:00. Fld/Flu are corrected with Tb (median
          1e9 W/m^2 meanwhile), so all three are unsalvageable (user,
          2026-11-16).
  Flu:
    exclude_dates:
      - start: 2026-10-20 12:00
        end: 2026-11-10 12:30
        comment: >-
          New CNR4's body thermistor miswired from the changeover until a site
          visit: Tb about -8000 to -12000 degC to 2026-11-10 09:30, no records
          10:00-12:30, valid from 13:00. Fld/Flu are corrected with Tb (median
          1e9 W/m^2 meanwhile), so all three are unsalvageable (user,
          2026-11-16).
  Fn:
    exclude_dates:
      - start: 2026-10-20 12:00
        end: 2026-11-10 12:30
        comment: >-
          Fn is calculated at L1 from Fsd - Fsu + Fld - Flu, and Fld/Flu are
          excluded here (miswired CNR4 body thermistor): their ~1e9 W/m^2
          values nearly cancel, leaving an Fn that would pass its range.
